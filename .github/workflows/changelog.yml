name: Check changelog entry

on:
  pull_request:
  workflow_call:

jobs:
  changelog:
    name: Check changelog entry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Require a changelog entry for client-facing changes
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          git merge-base --is-ancestor "$BASE" HEAD || exit 0
          CHANGED=$(git diff --name-only "$BASE"...HEAD)
          grep -qE '^packages/graphql/(schema/.+\.graphql|custom-resolvers\.ts|deprecated-fields\.ts)$' <<< "$CHANGED" || exit 0
          if grep -qx 'apps/docs/src/content/docs/en/changelog.mdx' <<< "$CHANGED" && grep -qx 'apps/docs/src/content/docs/changelog.mdx' <<< "$CHANGED"; then exit 0; fi
          if git log --format=%B "$BASE"..HEAD | grep -q '\[skip changelog\]'; then exit 0; fi
          echo '::error::GraphQL schema or resolvers changed without a changelog entry. Add one to both apps/docs/src/content/docs/en/changelog.mdx and its Thai translation apps/docs/src/content/docs/changelog.mdx, or put [skip changelog] in a commit message.'
          exit 1
