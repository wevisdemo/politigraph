# PDPA: logs keep only the network prefix (IPv4 /24, IPv6 /48), never the full visitor IP
map $remote_addr $remote_network {
  ~^(?<prefix>\d+\.\d+\.\d+)\.\d+$ $prefix.0;
  ~*^(?<prefix>[0-9a-f]+:[0-9a-f]+:[0-9a-f]+): $prefix::;
  default '';
}

# Query strings can carry auth tokens, e.g. email verification links
map $http_referer $referer_path {
  ~^(?<path>[^?]*) $path;
}

log_format json escape=json '{"remote_network":"$remote_network","method":"$request_method","uri":"$uri","status":$status,"bytes":$body_bytes_sent,"request_time":$request_time,"upstream_time":"$upstream_response_time","referer":"$referer_path","user_agent":"$http_user_agent"}';

# Error lines embed the full visitor IP and can't be reformatted, failures still show as 5xx in the access log
error_log /var/log/nginx/error.log alert;

server {
  listen 443 ssl default_server reuseport;
  listen [::]:443 ssl default_server reuseport;

  access_log /var/log/nginx/access.log json;

  ssl_certificate /var/tls/cert.pem;
  ssl_certificate_key /var/tls/key.pem;
  ssl_trusted_certificate /var/tls/ca.pem;

  server_name politigraph.wevis.info;

  error_page 502 504 = @unavailable;

  location @unavailable {
    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Retry-After' 600 always;
    default_type application/json;
    return 503 '{"errors":[{"message":"Politigraph is temporarily unavailable, please retry later"}]}';
  }

  location / {
    root /var/htdocs/docs;
    index index.html;
    try_files $uri $uri/index.html =404;
    add_header Cache-Control 'no-cache' always;
  }

  location ~ \.(md|graphql|txt)$ {
    root /var/htdocs/docs;
    default_type text/plain;
    charset utf-8;
    try_files $uri =404;
    add_header Cache-Control 'no-cache' always;
  }

  # Content-hashed build output, kept across deploys so open tabs can still fetch
  # chunks from the previous build
  location ^~ /_astro/ {
    root /var/htdocs/docs;
    try_files $uri =404;
    add_header Cache-Control 'public, max-age=31536000, immutable';
  }

  location ^~ /pagefind/fragment/ {
    root /var/htdocs/docs;
    try_files $uri =404;
    add_header Cache-Control 'public, max-age=31536000, immutable';
  }

  location ^~ /pagefind/index/ {
    root /var/htdocs/docs;
    try_files $uri =404;
    add_header Cache-Control 'public, max-age=31536000, immutable';
  }

  location ^~ /admin {
    alias /var/htdocs/admin;
    index index.html;
    try_files $uri $uri/ /admin/index.html;
    add_header Cache-Control 'no-cache' always;
  }

  location ^~ /admin/_nuxt/ {
    root /var/htdocs;
    try_files $uri =404;
    add_header Cache-Control 'public, max-age=31536000, immutable';
  }

  location ^~ /assets {
    if ($request_method = 'GET') {
      add_header 'Access-Control-Allow-Origin' '*' always;
      add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;
      add_header Cache-Control 'public, max-age=300';
    }

    alias /var/htdocs/assets;
    try_files $uri =404;
  }

  location ^~ /auth {
    proxy_pass http://127.0.0.1:3000/auth;
  }

  location ^~ /auth/sign-up {
    return 403 "Forbidden";
  }

  location ^~ /graphql {
    if ($request_method = 'OPTIONS') {
      add_header 'Access-Control-Allow-Origin' '*';
      add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
      add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Apollographql-Client-Name,Apollographql-Client-Version';
      add_header 'Access-Control-Max-Age' 1728000;
      add_header 'Content-Type' 'text/plain; charset=utf-8';
      add_header 'Content-Length' 0;
      return 204;
    }
    if ($request_method = 'POST') {
      add_header 'Access-Control-Allow-Origin' '*' always;
      add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;
    }
    if ($request_method = 'GET') {
      add_header 'Access-Control-Allow-Origin' '*' always;
      add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;
    }

    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Politigraph-Source "";
    proxy_pass http://127.0.0.1:3000/graphql;
  }

  location ^~ /mcp {
    if ($request_method = 'OPTIONS') {
      add_header 'Access-Control-Allow-Origin' '*';
      add_header 'Access-Control-Allow-Methods' 'GET, POST, DELETE, OPTIONS';
      add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Accept,Authorization,Mcp-Session-Id,Mcp-Protocol-Version';
      add_header 'Access-Control-Max-Age' 1728000;
      add_header 'Content-Type' 'text/plain; charset=utf-8';
      add_header 'Content-Length' 0;
      return 204;
    }

    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range,Mcp-Session-Id,Mcp-Protocol-Version' always;

    proxy_buffering off;
    proxy_read_timeout 60s;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_pass http://127.0.0.1:3000/mcp;
  }

  location ^~ /observe {
    client_max_body_size 10m;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 300s;
    proxy_pass http://127.0.0.1:5080;
  }

  location ^~ /playground {
    # The Location header carries the whole compressed operation
    proxy_buffer_size 16k;
    proxy_buffers 8 16k;

    proxy_pass http://127.0.0.1:3000/playground;
  }

  location ^~ /upload-image {
    proxy_pass http://127.0.0.1:3000/upload-image;
  }
}
