server {
  listen 443 ssl default_server reuseport;
  listen [::]:443 ssl default_server reuseport;

  ssl_certificate /var/tls/cert.pem;
  ssl_certificate_key /var/tls/key.pem;
  ssl_trusted_certificate /var/tls/ca.pem;

  server_name politigraph.wevis.info;

  error_page 502 504 = @unavailable;

  location @unavailable {
    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Retry-After' 600 always;
    default_type application/json;
    return 503 '{"errors":[{"message":"Politigraph is temporarily unavailable, please retry later"}]}';
  }

  location / {
    root /var/htdocs/docs;
    index index.html;
    try_files $uri $uri/index.html =404;
    add_header Cache-Control 'no-cache' always;
  }

  location ~ \.(md|graphql|txt)$ {
    root /var/htdocs/docs;
    default_type text/plain;
    charset utf-8;
    try_files $uri =404;
    add_header Cache-Control 'no-cache' always;
  }

  # Content-hashed build output, kept across deploys so open tabs can still fetch
  # chunks from the previous build
  location ^~ /_astro/ {
    root /var/htdocs/docs;
    try_files $uri =404;
    add_header Cache-Control 'public, max-age=31536000, immutable';
  }

  location ^~ /pagefind/fragment/ {
    root /var/htdocs/docs;
    try_files $uri =404;
    add_header Cache-Control 'public, max-age=31536000, immutable';
  }

  location ^~ /pagefind/index/ {
    root /var/htdocs/docs;
    try_files $uri =404;
    add_header Cache-Control 'public, max-age=31536000, immutable';
  }

  location ^~ /admin {
    alias /var/htdocs/admin;
    index index.html;
    try_files $uri $uri/ /admin/index.html;
    add_header Cache-Control 'no-cache' always;
  }

  location ^~ /admin/_nuxt/ {
    root /var/htdocs;
    try_files $uri =404;
    add_header Cache-Control 'public, max-age=31536000, immutable';
  }

  location ^~ /assets {
    # Uploads are addressed by entity name, so replacing an image reuses its URL.
    # Must stay inside the if block, which would otherwise mask a location-level
    # add_header for GET requests
    if ($request_method = 'GET') {
      add_header 'Access-Control-Allow-Origin' '*' always;
      add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;
      add_header Cache-Control 'public, max-age=300';
    }

    alias /var/htdocs/assets;
    try_files $uri =404;
  }

  location ^~ /auth {
    proxy_pass http://127.0.0.1:3000/auth;
  }

  location ^~ /auth/sign-up {
    return 403 "Forbidden";
  }

  location ^~ /graphql {
    if ($request_method = 'OPTIONS') {
      add_header 'Access-Control-Allow-Origin' '*';
      add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
      add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range';
      add_header 'Access-Control-Max-Age' 1728000;
      add_header 'Content-Type' 'text/plain; charset=utf-8';
      add_header 'Content-Length' 0;
      return 204;
    }
    if ($request_method = 'POST') {
      add_header 'Access-Control-Allow-Origin' '*' always;
      add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;
    }
    if ($request_method = 'GET') {
      add_header 'Access-Control-Allow-Origin' '*' always;
      add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;
    }

    proxy_pass http://127.0.0.1:3000/graphql;
  }

  location ^~ /mcp {
    if ($request_method = 'OPTIONS') {
      add_header 'Access-Control-Allow-Origin' '*';
      add_header 'Access-Control-Allow-Methods' 'GET, POST, DELETE, OPTIONS';
      add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Accept,Authorization,Mcp-Session-Id,Mcp-Protocol-Version';
      add_header 'Access-Control-Max-Age' 1728000;
      add_header 'Content-Type' 'text/plain; charset=utf-8';
      add_header 'Content-Length' 0;
      return 204;
    }

    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range,Mcp-Session-Id,Mcp-Protocol-Version' always;

    proxy_buffering off;
    proxy_read_timeout 60s;
    proxy_pass http://127.0.0.1:3000/mcp;
  }

  location ^~ /playground {
    # The Location header carries the whole compressed operation
    proxy_buffer_size 16k;
    proxy_buffers 8 16k;

    proxy_pass http://127.0.0.1:3000/playground;
  }

  location ^~ /upload-image {
    proxy_pass http://127.0.0.1:3000/upload-image;
  }
}
