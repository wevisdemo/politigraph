"""
ลิงก์ไปยังเว็บไซต์ภายนอกที่เกี่ยวข้อง
"""
type Link
	@node
	@authorization(
		filter: [
			{ where: {} }
			{
				requireAuthentication: false
				where: {
					node: {
						NOT: {
							OR: [
								{ owner: { Person: { publish_status: { eq: "UNPUBLISHED" } } } }
								{
									owner: {
										Membership: {
											member: {
												Person: { publish_status: { eq: "UNPUBLISHED" } }
											}
										}
									}
								}
								{
									owner: {
										VoteEvent: { publish_status: { eq: "UNPUBLISHED" } }
									}
								}
								{
									owner: {
										BillVoteEvent: { publish_status: { eq: "UNPUBLISHED" } }
									}
								}
								{
									owner: {
										BillMergeEvent: { publish_status: { eq: "UNPUBLISHED" } }
									}
								}
								{
									owner: {
										BillEnactEvent: { publish_status: { eq: "UNPUBLISHED" } }
									}
								}
								{
									owner: {
										BillRejectEvent: { publish_status: { eq: "UNPUBLISHED" } }
									}
								}
								{
									owner: {
										BillRoyalAssentEvent: {
											publish_status: { eq: "UNPUBLISHED" }
										}
									}
								}
							]
						}
					}
				}
			}
		]
	) {
	"""
	ID แบบสุ่ม
	"""
	id: ID! @id
	"""
	URL
	"""
	url: String!
	"""
	คำอธิบาย
	"""
	note: String
	"""
	เว็บไซต์ภายเชื่อมโยงกับอะไรในฐานข้อมูล
	"""
	owner: LinkOwner
		@relationship(type: "HAVE", properties: "Relation", direction: IN)
	"""
	วันที่เพิ่มลงในฐานข้อมูล
	"""
	created_at: DateTime! @timestamp(operations: [CREATE])
	"""
	วันที่แก้ไขข้อมูลล่าสุด
	"""
	updated_at: DateTime @timestamp(operations: [UPDATE])
}
