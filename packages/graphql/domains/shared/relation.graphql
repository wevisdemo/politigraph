"""
ความสัมพันธ์ทั่วไป
"""
type Relation @relationshipProperties {
	"""
	ID แบบสุ่ม
	"""
	id: ID! @populatedBy(callback: "relationId", operations: [CREATE])
	"""
	วันที่เพิ่มลงในฐานข้อมูล
	"""
	created_at: DateTime!
		@populatedBy(callback: "relationCreatedAt", operations: [CREATE])
	"""
	วันที่แก้ไขข้อมูลล่าสุด
	"""
	updated_at: DateTime @timestamp(operations: [UPDATE])
}
